# TrueRehab-RF Pi set: settings for a real kit (the live radar and the MyoWare sEMG, no demo data).
# install.sh copies this to pi-bridge/config.toml once; edit that copy (an update never overwrites it).

[bridge]
name = "TrueRehab kit 01"     # shown at the top of the dashboard
kit_id = "KIT-01"             # matches the kit sticker
ws_port = 8765                # live data (WebSocket)
http_port = 8080              # serves the dashboard: open http://<kit>.local:8080 on the same Wi-Fi
web_root = "../frontend/dist" # the built dashboard, relative to this file
status_interval_ms = 1000
frame_dtype = "u8"            # 8-bit maps: 4x less Wi-Fi traffic than "f32", no visible difference (recordings keep everything)
client_queue = 120
record_dir = "~/truerehab-sessions"   # Start/Stop in the dashboard records every sensor here (recorder format), one clock

# Kit key (who may connect). Empty = open kit: anyone on the Wi-Fi can watch and press Start/Stop.
# Make one:  .venv/bin/python -m truerehab_bridge --new-key --write /boot/firmware/trh-key.txt
key_file = ""
key = ""

[providers.synthetic]
enabled = false               # demo data; leave off on a real kit

[providers.radar]
enabled = true                # the AWR2944PEVM on USB (power the radar first, then plug in USB)
data_port = "auto"            # finds the board's two TI XDS110 ports (/dev/ttyACM0 and /dev/ttyACM1)
cli_port = "auto"
start_radar = true            # sends radar-lab's profile at start, like the recorder; never flashes anything
cfg_file = ""                 # "" = ../radar-lab/configs/fullmap_awr2x44p.cfg (60 fps, 64 range bins, 16 Doppler)
fps = 10                      # maps per second to viewers (the radar runs at 60; recordings keep all 60)
max_range_m = 2.4
replay = ""                   # a recorder session folder: play it instead of the live radar (testing)

[providers.emg]
enabled = false               # turn on once the MyoWare runs firmware/myoware_record (Wi-Fi link): envelope + median frequency
port = "tcp://truerehab-myoware.local:3334"   # its Wi-Fi link (worn on battery). A USB port like "/dev/ttyUSB0": bench only
baud = 921600                 # USB only
env_hz = 25                   # envelope values per second to viewers (fewer small Wi-Fi packets; still smooth)
active_ratio = 9              # median frequency only during movement (power >= 9x rest); 0 = always
