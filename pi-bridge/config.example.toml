# TrueRehab bridge settings. Copy to config.toml and edit.
#   python -m truerehab_bridge --config config.toml

[bridge]
name = "TrueRehab kit 01"     # shown at the top of the dashboard
kit_id = "KIT-01"             # matches the kit sticker (see CLAUDE/plans/2026-10-10-multi-kit-identity.md)
ws_port = 8765                # live data (WebSocket)
http_port = 8080              # serves the dashboard: people open http://<pi>.local:8080. 0 = off
web_root = "../frontend/dist" # built dashboard (npm run build), relative to this file
status_interval_ms = 1000
frame_dtype = "f32"           # "u16" or "u8" cut Wi-Fi traffic 2–4× with a little precision loss
client_queue = 120            # per-viewer buffer; a slow phone drops messages instead of slowing the Pi

# ---- Kit key: who may connect (protocol 1.2). Leave both empty for an OPEN kit (anyone on the Wi-Fi). ----
# Make one:  python -m truerehab_bridge --new-key --write /boot/firmware/trh-key.txt
key_file = ""                 # file holding the key. Put it on the SD card's boot partition so any computer can read it
key = ""                      # or the key itself (64 characters). The file is better: keep keys out of config files you share

# ---- Data providers. Turn on what this kit has. ----

[providers.synthetic]
enabled = true                # DEMO DATA. Turn off on a real kit.
fps = 20
rows = 64
cols = 64

[providers.serial_aux]
enabled = false               # Arduino (sEMG / force) plugged into the Pi
port = "auto"                 # or e.g. "/dev/ttyACM0"; set it if more than one serial device is plugged in
baud = 115200
columns = ["emg_rms", "force_n"]   # names for plain CSV lines like "0.31,20.4"
rate_hz = 100
  [[providers.serial_aux.channels]]
  key = "emg_rms"
  label = "sEMG (biceps)"
  unit = "RMS"
  [[providers.serial_aux.channels]]
  key = "force_n"
  label = "Force"
  unit = "N"

[providers.radar]
enabled = false               # TEMPLATE: announces the radar view but sends nothing until capture is written
view = "range_doppler"
rows = 64
cols = 64
fps = 20
range_max_m = 3.0
velocity_max_ms = 2.0
